<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    (function() {
        const QR_DURATION_MS = 120000; // 2 minutes
        const QR_VERSION = '2'; // cache-buster for scan page
        const qrContainer = document.getElementById('qrCodePlaceholder');
        const codeValueEl = document.getElementById('qrCodeValue');
    const expiryTextEl = document.getElementById('qrExpiryText');
    const expiryValueEl = expiryTextEl.querySelector('span');
        const progressFillEl = document.getElementById('qrProgressFill');
        let cycleStart = Date.now();
        let refreshTimer;
        let countdownTimer;
        let qrInstance;

        function formatRemaining(ms) {
            const seconds = Math.max(0, Math.ceil(ms / 1000));
            const minutes = Math.floor(seconds / 60);
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${minutes} min ${secs} sek`;
        }

        function randomCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function targetUrl() {
            const url = new URL('./qrscan/scan.html', window.location.href);
            url.searchParams.set('v', QR_VERSION);
            url.searchParams.set('t', Math.floor(Date.now() / 1000).toString());
            return url.href;
        }

        function updateCountdown() {
            const elapsed = Date.now() - cycleStart;
            const remaining = Math.max(0, QR_DURATION_MS - elapsed);
            expiryValueEl.textContent = formatRemaining(remaining);
            const progress = (remaining / QR_DURATION_MS) * 100;
            progressFillEl.style.width = `${progress}%`;

            if (remaining <= 0) {
                refreshPayload();
            }
        }

        function refreshPayload() {
            cycleStart = Date.now();
            const code = randomCode();
            codeValueEl.textContent = code;

            qrContainer.innerHTML = '';
            qrInstance = new QRCode(qrContainer, {
                text: targetUrl(),
                width: 220,
                height: 220,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });

            progressFillEl.style.width = '100%';
            expiryValueEl.textContent = formatRemaining(QR_DURATION_MS);

            clearTimeout(refreshTimer);
            clearInterval(countdownTimer);
            countdownTimer = setInterval(updateCountdown, 1000);
            refreshTimer = setTimeout(refreshPayload, QR_DURATION_MS);
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                const elapsed = Date.now() - cycleStart;
                if (elapsed >= QR_DURATION_MS) {
                    refreshPayload();
                }
            }
        });

        refreshPayload();
    })();
</script>
