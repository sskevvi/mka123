<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>mObywatel</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="css/main.css" as="style">
    <link rel="preload" href="assets/icons/app_icon.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    
    <!-- Fonts - with display=swap for faster text rendering -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>
    <!-- Main App Container -->
    <main id="app"></main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#dashboard" class="nav-item active" data-target="dashboard">
            <span class="material-symbols-outlined">home</span>
            <span>Start</span>
        </a>
        <a href="#services" class="nav-item" data-target="services">
            <span class="material-symbols-outlined" style="border-radius: 4px;">folder</span>
            <span>Usługi</span>
        </a>
        <a href="#qr" class="nav-item" data-target="qr">
            <span class="material-symbols-outlined">qr_code_scanner</span>
            <span>Kod QR</span>
        </a>
        <a href="#more" class="nav-item" data-target="more">
            <span class="material-symbols-outlined">grid_view</span>
            <span>Więcej</span>
        </a>
    </nav>

    <!-- External Scripts (defer for non-blocking) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

    <!-- App Entry Point -->
    <script type="module" src="js/app.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
</body>
</html>
